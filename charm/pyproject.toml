[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-as-code"
version = "0.1.0"
description = "Terrasquid - Proxy-as-Code Juju machine charm"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "ops>=3.7.0,<4",
    "django>=5.2.14,<6",
    "djangorestframework>=3.17.1",
    "djangorestframework-api-key>=3.1.0",
    "drf-spectacular>=0.29.0",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "Jinja2>=3.1.6",
    "whitenoise>=6.12.0",
    "dj-database-url>=3.1.2",
    "charmlibs-interfaces-tls-certificates>=1.8.3",
    "cosl>=1.10.2",
    "django-prometheus>=2.5.0",
    "opentelemetry-sdk>=1.45.1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
    "opentelemetry-instrumentation-django>=0.66b1,<1",
    "opentelemetry-instrumentation-psycopg>=0.66b1,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "ruff>=0.15.12",
    "pyright>=1.1.409",
    "codespell>=2.4.2",
    "ops[testing]>=3.7.0",
    "jubilant>=1.9.0",
    "pytest-jubilant>=2.0.1",
    "requests>=2.34.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM", "ARG"]
ignore = ["D100", "D104", "D107", "D203", "D213", "D102", "ARG002"]
# Ignore docstring errors in migration files and Meta class warnings in models and serializers
per-file-ignores = {"src/django_app/terrasquid/api/migrations/*.py" = ["D"], "src/django_app/terrasquid/api/models.py" = ["D106"], "src/django_app/terrasquid/api/serializers.py" = ["D106"]}

[tool.pyright]
pythonVersion = "3.12"
include = ["src"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "terrasquid.settings"
pythonpath = ["src/django_app", "src", "lib"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short"

[dependency-groups]
dev = [
    "ops[testing]>=3.7.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
