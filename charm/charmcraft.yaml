name: terrasquid
type: charm
summary: Terrasquid - A Juju machine charm for managing Squid proxy via REST API
description: |
  Terrasquid provides a Django REST Framework API for managing Squid proxy
  ACLs, sources, destinations, and port groups. Supports HA deployments
  with PostgreSQL and automatic configuration reload.
base: ubuntu@24.04
version: v0.0.1
platforms:
  amd64:

config:
  options:
    squid-port:
      type: int
      default: 3128
      description: Port Squid listens on.
    squid-watcher-interval:
      type: int
      default: 30
      description: Interval in seconds between Squid configuration checks.
    api-port:
      type: int
      default: 8080
      description: Port the REST API (Gunicorn) listens on.
    gunicorn-workers:
      type: int
      default: 4
      description: Number of Gunicorn worker processes.
    squid-prepend-config:
      type: string
      default: ""
      description: Raw Squid configuration lines inserted before the generated Source ACLs section.
    squid-append-config:
      type: string
      default: ""
      description: Raw Squid configuration lines inserted after the ACL Rules section and before the default deny.
    squid-default-deny:
      type: boolean
      default: true
      description: When true, append "http_access deny all" as the final rule (default deny). Set to false to omit it.
    squid-pinned-config-version:
      type: int
      default: 0
      description: |
        Pin every unit to the full rendered Squid configuration retained for a
        specific version number. Pinning does not rewind API resources or stop
        new database versions from being created. Set to 0 (the default) to
        apply the latest rendered configuration. If a positive version has not
        been retained, the watcher skips updates until it is available. History
        retains every revision from the trailing 24 hours and one revision per
        older UTC day.
    external-hostname:
      type: string
      default: ""
      description: |
        The hostname to request for the TLS certificate

actions:
  create-key:
    description: Create a new API key for a service.
    params:
      name:
        type: string
        description: Human-readable name for the API key.
    required: [name]
  revoke-key:
    description: Revoke an existing API key by name.
    params:
      name:
        type: string
        description: Name of the API key to revoke.
    required: [name]
  rotate-key:
    description: Rotate (revoke and recreate) an API key by name.
    params:
      name:
        type: string
        description: Name of the API key to rotate.
    required: [name]
  list-keys:
    description: List all API keys (name, prefix, created, revoked status).
  reconfigure:
    description: Manually trigger Squid config re-render and reload on this unit.
  createsuperuser:
    description: Create a Django superuser for admin UI access
    params:
      username:
        type: string
        description: Username for the superuser
      email:
        type: string
        description: Email address for the superuser
        default: admin@example.com
    required: [username]
    output:
      properties:
        result:
          type: string
          description: Status message
        password:
          type: string
          description: Auto-generated password for the new superuser

requires:
  database:
    interface: postgresql_client
    limit: 1
  certificates:
    interface: tls-certificates
  django-ingress:
    interface: ingress
    limit: 1
    optional: true
  squid-ingress:
    interface: ingress
    limit: 1
    optional: true

provides:
  cos-agent:
    interface: cos_agent
    limit: 1

charm-libs:
  - lib: data_platform_libs.data_interfaces
    version: "0"
  - lib: traefik_k8s.ingress
    version: "2"
  - lib: grafana_agent.cos_agent
    version: "0"

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - build-essential
      - libpq-dev
      - apt-transport-https

peers:
  squid-aaas-peers:
    interface: squid_aaas_peers
