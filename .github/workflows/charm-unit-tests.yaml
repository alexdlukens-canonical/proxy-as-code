name: Charm unit tests

on:
  push:
    branches:
      - main
    paths:
      - "charm/**"
      - ".github/workflows/charm-unit-tests.yaml"
  pull_request:
    paths:
      - "charm/**"
      - ".github/workflows/charm-unit-tests.yaml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Charm unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: charm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install tox tox-uv
      - name: Run unit tests
        run: tox -e unit
      - name: Comment coverage on PR
        if: >-
          ${{ always() && hashFiles('charm/.coverage') != '' &&
              (github.event_name == 'push' ||
               (github.event.pull_request.head.repo.full_name == github.repository &&
                github.actor != 'dependabot[bot]')) }}
        uses: py-cov-action/python-coverage-comment-action@v4.1
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_PATH: charm
          ACTIVITY: ${{ github.event_name == 'push' && 'save_coverage_data_files' || 'process_pr' }}
      - name: Upload coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: charm-unit-coverage
          path: |
            charm/htmlcov/
            charm/coverage.xml
          if-no-files-found: warn
