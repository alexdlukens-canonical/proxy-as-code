name: Publish Terrasquid charm to edge

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - uses: canonical/operator-workflows/internal/plan@main
        id: plan
        with:
          working-directory: ./charm

  build:
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        build: ${{ fromJSON(needs.plan.outputs.plan).build }}
    steps:
      - uses: canonical/setup-lxd@v1
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: ${{ matrix.build.type == 'charm' }}
        with:
          python-version: "3.12"
      - name: Install charmcraft
        if: ${{ matrix.build.type == 'charm' }}
        run: sudo snap install charmcraft --channel latest/stable --classic
      - name: Get operator-workflows version
        if: ${{ matrix.build.type == 'charm' }}
        id: workflow-version
        uses: canonical/get-workflow-version-action@v1.0.4
        with:
          repository-name: canonical/operator-workflows
          file-name: integration_test.yaml
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install charmbuild
        if: ${{ matrix.build.type == 'charm' }}
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install "git+https://github.com/canonical/operator-workflows@${{ steps.workflow-version.outputs.sha }}#subdirectory=charmbuild"
      - uses: canonical/operator-workflows/internal/build@main
        with:
          build-plan: ${{ toJSON(matrix.build) }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  publish-to-edge:
    needs: build
    uses: canonical/operator-workflows/.github/workflows/publish_charm.yaml@main
    permissions:
      actions: read
      contents: write
    secrets: inherit
    with:
      channel: latest/edge
      force-publish: ${{ github.event_name == 'workflow_dispatch' }}
      workflow-run-id: ${{ github.run_id }}
      working-directory: ./charm
