name: Publish Terrasquid charm to edge

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      has-code-changes: ${{ steps.changes.outputs.has-code-changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find publishable changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "has-code-changes=true" >> "$GITHUB_OUTPUT"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- . ':!*.md' ':!terraform*')"
            if [[ -n "$changed_files" ]]; then
              echo "has-code-changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "has-code-changes=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Check Charmhub credentials
        if: steps.changes.outputs.has-code-changes == 'true'
        env:
          CHARMHUB_TOKEN: ${{ secrets.CHARMHUB_TOKEN }}
        run: |
          if [[ -z "$CHARMHUB_TOKEN" ]]; then
            echo "::error::Set the CHARMHUB_TOKEN Actions secret to credentials exported by charmcraft login --export."
            exit 1
          fi
      - uses: canonical/operator-workflows/internal/plan@main
        id: plan
        with:
          working-directory: ./charm

  build:
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        build: ${{ fromJSON(needs.plan.outputs.plan).build }}
    steps:
      - uses: canonical/setup-lxd@v1
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: ${{ matrix.build.type == 'charm' }}
        with:
          python-version: "3.12"
      - name: Install charmcraft
        if: ${{ matrix.build.type == 'charm' }}
        run: sudo snap install charmcraft --channel latest/stable --classic
      - name: Install charmbuild
        if: ${{ matrix.build.type == 'charm' }}
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install "git+https://github.com/canonical/operator-workflows@main#subdirectory=charmbuild"
      - uses: canonical/operator-workflows/internal/build@main
        with:
          build-plan: ${{ toJSON(matrix.build) }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  publish-to-edge:
    needs: [plan, build]
    if: needs.plan.outputs.has-code-changes == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install charmcraft
        run: sudo snap install charmcraft --channel latest/stable --classic
      - uses: canonical/operator-workflows/internal/publish@main
        id: publish
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          charmhub-token: ${{ secrets.CHARMHUB_TOKEN }}
          plan: ${{ needs.plan.outputs.plan }}
          run-id: ${{ github.run_id }}
          working-directory: ./charm
      - name: Add version file to charm
        env:
          CHARM_FILES: ${{ steps.publish.outputs.charms }}
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          version_dir="$(mktemp -d)"
          echo "${GITHUB_SHA::8}" > "$version_dir/version"
          IFS=',' read -ra charm_files <<< "$CHARM_FILES"
          for charm_file in "${charm_files[@]}"; do
            charm_file="$(echo "$charm_file" | xargs)"
            if ! zipinfo -1 "$charm_file" | grep -qx "version"; then
              (cd "$version_dir" && zip "$charm_file" version)
            fi
          done
          rm "$version_dir/version"
          rmdir "$version_dir"
      - name: Upload charm to Charmhub
        uses: canonical/charming-actions/upload-charm@2.7.0
        with:
          built-charm-path: ${{ steps.publish.outputs.charms }}
          charm-path: ./charm
          credentials: ${{ secrets.CHARMHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          channel: latest/edge
          upload-image: false
      - name: Release charm libraries
        uses: canonical/charming-actions/release-libraries@2.7.0
        with:
          credentials: ${{ secrets.CHARMHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          charm-path: ./charm
